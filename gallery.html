<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词卡图鉴 | 我的世界英语单词卡</title>
  <meta name="description" content="浏览全部 Minecraft 主题英语单词卡：方块、工具、武器、食物、动物、怪物……拼写闯关，逐步解锁卡片。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="单词卡图鉴 | 我的世界英语单词卡">
  <meta property="og:description" content="浏览全部 Minecraft 主题英语单词卡：方块、工具、武器、食物、动物、怪物……拼写闯关，逐步解锁卡片。">
  <meta property="og:image" content="https://mcword.com/assets/images/share-cover.jpg">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/timer.css">
  <link rel="stylesheet" href="css/rank.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 微信分享抓取用隐藏缩略图 -->
  <div style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true"><img src="/assets/images/share-cover.jpg" alt=""></div>
  <!-- Gallery Page -->
  <div class="gallery-page">
    <header class="gallery-header">
      <div class="header-left">
        <a href="index.html" class="mc-btn mc-btn-sm">← Home</a>
        <h1 class="gallery-title">Word Cards</h1>
        <a href="videos.html" class="mc-btn mc-btn-sm btn-videos">📹 Videos</a>
      </div>
      <div class="header-right">
        <span id="rank-display" class="rank-badge" data-level="0"></span>
        <span id="user-display" class="user-display"></span>
        <button id="btn-leaderboard" class="mc-btn mc-btn-sm">🏆 Rank</button>
        <button id="btn-logout" class="mc-btn mc-btn-sm btn-logout">Logout</button>
      </div>
    </header>
    <nav id="tabs" class="tabs"></nav>
    <div id="category-stats" class="category-stats"></div>
    <main id="card-grid" class="card-grid"></main>
  </div>

  <!-- Spelling Game Modal -->
  <div id="game-modal" class="modal hidden">
    <div class="modal-content">
      <button id="btn-close-modal" class="btn-close">✕</button>
      <div id="game-area" class="game-area">
        <div class="game-top-bar">
          <div id="card-timer" class="card-timer">
            <span class="timer-icon">⏱</span>
            <span id="card-timer-display">15s</span>
          </div>
        </div>
        <div id="game-thumbnail" class="game-thumbnail">
          <img id="game-thumb-img" src="" alt="">
        </div>
        <div id="game-word-display" class="game-word-display"></div>
        <div id="game-drop-zone" class="game-drop-zone">
          <span class="drop-hint">Drop letters here</span>
        </div>
        <div id="game-letter-pool" class="game-letter-pool"></div>
        <div id="game-feedback" class="game-feedback"></div>
        <div id="game-attempts" class="game-attempts"></div>
        <div id="game-retry-bar" class="game-retry-bar hidden">
          <button id="btn-retry" class="btn-retry">🔄 Retry</button>
        </div>
      </div>
      <div id="game-result" class="game-result hidden">
        <img id="result-image" class="result-image" src="" alt="">
        <p id="result-word" class="result-word"></p>
        <p id="result-time" class="result-time"></p>
        <div class="result-actions">
          <button id="btn-favorite" class="btn-favorite hidden">⭐ Collect</button>
          <button id="btn-back-gallery" class="mc-btn mc-btn-sm">← Back to Cards</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboard-modal" class="modal hidden">
    <div class="modal-content leaderboard-content">
      <button id="btn-close-leaderboard" class="btn-close">✕</button>
      <h2 class="leaderboard-title">🏆 Leaderboard</h2>
      <div id="leaderboard-category" class="leaderboard-category"></div>
      <div id="leaderboard-list" class="leaderboard-list"></div>
    </div>
  </div>

  <script type="module" src="js/gallery-app.js"></script>
</body>
</html>
