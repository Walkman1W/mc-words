<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的世界英语单词卡 | Minecraft Word Cards</title>
  <meta name="description" content="在我的世界里学英语！160 张 Minecraft 主题英语单词卡，拼写闯关、计时排行，边玩边记单词。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="我的世界英语单词卡 | Minecraft Word Cards">
  <meta property="og:description" content="在我的世界里学英语！160 张 Minecraft 主题英语单词卡，拼写闯关、计时排行，边玩边记单词。">
  <meta property="og:image" content="https://mcword.com/assets/images/share-cover.jpg">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/landing.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 微信分享抓取用隐藏缩略图 -->
  <div style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true"><img src="/assets/images/share-cover.jpg" alt=""></div>
  <div class="landing-page">
    <div class="landing-bg"></div>
    <div class="landing-overlay"></div>
    <div class="landing-content">
      <div class="landing-top-title">
        <div class="landing-logo">
          <span class="logo-m">M</span><span class="logo-i">I</span><span class="logo-n">N</span><span class="logo-e">E</span><span class="logo-c">C</span><span class="logo-r">R</span><span class="logo-a">A</span><span class="logo-f">F</span><span class="logo-t">T</span>
        </div>
        <h2 class="mc-subtitle">~ Word Cards ~</h2>
        <p class="landing-desc">Learn English words through Minecraft!</p>
      </div>
      <div class="landing-login-box">
        <label class="login-label" for="username-input">Enter your name</label>
        <div class="username-wrapper">
          <input type="text" id="username-input" class="mc-input" placeholder="Player name..." maxlength="16" autocomplete="off">
          <button id="btn-user-dropdown" class="btn-dropdown" type="button">▼</button>
          <div id="user-dropdown" class="user-dropdown hidden"></div>
        </div>
        <p id="login-error" class="login-error hidden"></p>
      </div>
      <button id="btn-start" class="mc-btn">
        <span class="btn-icon">▶</span> Start
      </button>
      <div class="landing-links">
        <a href="videos.html" class="mc-btn mc-btn-sm">📹 Video Library</a>
      </div>
      <div class="landing-hint">Enter a name and click Start</div>
    </div>
    <div class="landing-particles"></div>
  </div>
  <script type="module" src="js/landing-app.js"></script>
</body>
</html>
