<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词卡视频库 | 我的世界英语单词卡</title>
  <meta name="description" content="Minecraft 英语单词卡视频合集：看图识词、跟读发音，长视频合集持续更新。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="单词卡视频库 | 我的世界英语单词卡">
  <meta property="og:description" content="Minecraft 英语单词卡视频合集：看图识词、跟读发音，长视频合集持续更新。">
  <meta property="og:image" content="https://mcword.com/assets/images/share-cover.jpg">
  <link rel="stylesheet" href="css/main.css?v=2">
  <link rel="stylesheet" href="css/videos.css?v=4">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 微信分享抓取用缩略图：真实尺寸渲染但移出视口 -->
  <img src="/assets/images/share-cover.jpg" alt="" width="600" height="842" aria-hidden="true"
       style="position:fixed;left:-9999px;top:-9999px;width:600px;height:842px;pointer-events:none;z-index:-1;">
  <!-- Videos Page -->
  <div class="videos-page">
    <header class="videos-header">
      <div class="header-left">
        <a href="index.html" class="mc-btn mc-btn-sm">← Home</a>
        <h1 class="videos-title">Video Library</h1>
      </div>
      <div class="header-right">
        <a href="https://space.bilibili.com/422489691" target="_blank" rel="noopener" class="mc-btn mc-btn-sm btn-bilibili">B站主页</a>
        <span id="user-display" class="user-display"></span>
        <button id="btn-logout" class="mc-btn mc-btn-sm btn-logout">Logout</button>
      </div>
    </header>

    <main class="videos-content">
      <!-- 视频统计 -->
      <div id="video-stats" class="video-stats"></div>

      <!-- 长视频合集专区 -->
      <section id="long-video-section" class="long-video-section hidden">
        <h2 class="long-video-heading">长视频合集 <span class="long-video-heading-en">Long Videos</span></h2>
        <div id="long-video-grid" class="long-video-grid"></div>
      </section>

      <!-- 视频分类标签 -->
      <div id="video-tabs" class="video-tabs"></div>

      <!-- 视频网格 -->
      <div id="video-grid" class="video-grid"></div>

      <!-- 空状态提示 -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">🚧</div>
        <p class="empty-text">Under Construction</p>
        <p class="empty-hint">Videos are being prepared. Stay tuned!</p>
        <div class="construction-animation">
          <span class="dot">.</span>
          <span class="dot">.</span>
          <span class="dot">.</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Video Player Modal -->
  <div id="video-modal" class="modal hidden">
    <div class="modal-content video-modal-content">
      <button id="btn-close-video" class="btn-close">✕</button>
      <div class="video-player-wrapper">
        <div id="video-player" class="video-player">
          <!-- Bilibili iframe 或 video 标签将在这里 -->
        </div>
      </div>
      <div class="video-info">
        <h2 id="video-title" class="video-title"></h2>
        <p id="video-description" class="video-description"></p>
      </div>
    </div>
  </div>

  <script type="module" src="js/video-app.js?v=4"></script>
</body>
</html>
